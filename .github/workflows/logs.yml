name: logs

on:
  schedule:
    # GitHub cron is UTC. Every 30 minutes keeps usage inside the
    # 2,000 free private-repo Actions minutes per month.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logs
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-v1-${{ github.run_id }}
          restore-keys: |
            state-v1-

      - name: Poll feeds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py

      - name: Save state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-v1-${{ github.run_id }}
